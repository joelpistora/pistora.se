<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joel Pistora</title>
<meta name="description" content="Joel Pistora.">
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding: 2.5rem 1.5rem;
    background: #14100d url("https://assets.joel.pistora.se/cats-portrait.jpg")
      center / cover no-repeat;
    color: #fff;
    font: 400 1rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0) 45%);
    pointer-events: none;
  }
  main {
    position: relative;
    text-align: center;
    max-width: 24rem;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 5vw, 2rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
  }
  .links {
    margin: 1.5rem 0 0;
    padding: 0;
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 1.25rem;
    flex-wrap: wrap;
  }
  .links a {
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
  }
  .links a:hover,
  .links a:focus-visible {
    text-decoration: underline;
  }
  @media (min-width: 700px) {
    body {
      background-image: url("https://assets.joel.pistora.se/cats-landscape.jpg");
    }
  }
</style>
</head>
<body>
  <main>
    <h1>Joel Pistora</h1>
    <ul class="links">
      <li><a href="mailto:joel@pistora.se">Email</a></li>
      <li><a href="https://www.linkedin.com/in/joel-pistora/">LinkedIn</a></li>
      <li><a href="https://www.instagram.com/joelpistora/">Instagram</a></li>
      <li><a href="https://open.spotify.com/artist/4TyALEGyYDpWdE5Mzfgiy3">Spotify</a></li>
    </ul>
  </main>
</body>
</html>
