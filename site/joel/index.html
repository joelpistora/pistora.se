<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOEL PISTORA</title>
<meta name="description" content="Joel Pistora.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%90%B1</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doppio+One&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 2.5rem 1.5rem;
    background: #14100d url("https://assets.joel.pistora.se/island-portrait.jpg")
      center / cover no-repeat;
    color: #fff;
    font: 400 1rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    position: relative;
  }
  main {
    position: relative;
    text-align: center;
    transform: translateY(-8%);
  }
  h1 {
    margin: 0 auto;
    font-family: "Doppio One", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-weight: 400;
    font-size: clamp(2.75rem, 10vw, 4.75rem);
    line-height: 0.92;
    letter-spacing: -0.01em;
    text-wrap: balance;
    text-shadow: 0 2px 20px rgba(0, 0, 0, 0.55);
  }
  .links {
    margin: 2.25rem auto 0;
    padding: 0;
    max-width: 28rem;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: clamp(1.5rem, 8vw, 3.5rem);
  }
  .links a {
    display: block;
    color: #fff;
    line-height: 0;
    opacity: 0.95;
    filter: drop-shadow(0 1px 6px rgba(0, 0, 0, 0.45));
    transition: opacity 0.2s ease;
  }
  .links a:hover,
  .links a:focus-visible {
    opacity: 0.45;
  }
  .links svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .tooltip {
    position: relative;
  }
  .tooltip::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    color: #fff;
    background: rgba(0, 0, 0, 0.6);
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .tooltip:hover::after,
  .tooltip:focus-visible::after {
    opacity: 1;
  }
  @media (min-width: 700px) {
    body {
      background-image: url("https://assets.joel.pistora.se/island-landscape.jpg");
    }
  }
</style>
</head>
<body>
  <main>
    <h1>JOEL PISTORA</h1>
    <ul class="links">
      <li>
        <a href="mailto:joel@pistora.se" aria-label="Email">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M4 7l8 6 8-6"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="https://www.linkedin.com/in/joel-pistora/" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="4"/>
            <line x1="7.5" y1="10" x2="7.5" y2="17"/>
            <circle cx="7.5" cy="6.7" r="0.9" fill="currentColor" stroke="none"/>
            <path d="M11.5 17v-4.2c0-1.6 1-2.6 2.4-2.6 1.3 0 2.1 0.9 2.1 2.5V17"/>
            <line x1="11.5" y1="10" x2="11.5" y2="17"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="https://www.instagram.com/joelpistora/" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4.2"/>
            <circle cx="17.2" cy="6.8" r="0.9" fill="currentColor" stroke="none"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="https://open.spotify.com/artist/4TyALEGyYDpWdE5Mzfgiy3" aria-label="Spotify">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9.5"/>
            <path d="M6.5 9.8c3.6-1 8-0.6 11 1.1"/>
            <path d="M7 13c3-0.8 6.6-0.5 9 0.9"/>
            <path d="M7.6 16c2.3-0.6 5-0.4 6.9 0.7"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="https://pistora.se" aria-label="Pistora.se">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 6h14"/>
            <path d="M7.5 6v12"/>
            <path d="M16.5 6v12"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="https://skanepowerhouse.com" aria-label="Skåne Powerhouse — coming soon"
          class="tooltip" data-tooltip="coming soon…">
          <svg viewBox="0 0 8.5 7" aria-hidden="true">
            <rect width="8.5" height="7" fill="#C8102E" stroke="none"/>
            <rect x="3" width="1" height="7" fill="#FFCD00" stroke="none"/>
            <rect y="3" width="8.5" height="1" fill="#FFCD00" stroke="none"/>
            <rect x="0.06" y="0.06" width="8.38" height="6.88" fill="none"
              stroke="rgba(255,255,255,0.85)" stroke-width="0.12"/>
          </svg>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
