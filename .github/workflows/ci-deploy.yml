name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build + verify + list what would be uploaded, but upload nothing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:api
      - run: npm run build
        env:
          # CI build only; the deploy job builds again with the real value.
          NEXT_PUBLIC_API_BASE: https://api.pistora.se
      - run: npm run build:api
      - name: Guard - apps/api/dist must not import "shared" at runtime
        run: |
          if grep -rn --include='*.js' 'from "shared"' apps/api/dist; then
            echo "::error::apps/api/dist imports 'shared' at runtime (packages/shared is types-only)"
            exit 1
          fi

  deploy:
    name: Deploy web to Hostek
    needs: ci
    # Push to main, or manual run. A real (non-dry) manual run is only allowed from main.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.dry_run || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build web (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: https://api.pistora.se
      - name: Verify build output
        run: |
          if grep -r "localhost:3001" apps/web/out/_next/; then
            echo "::error::build contains localhost:3001 - NEXT_PUBLIC_API_BASE was not applied"
            exit 1
          fi
          if ! grep -rq "api.pistora.se" apps/web/out/_next/; then
            echo "::error::build does not reference api.pistora.se"
            exit 1
          fi
          if [ ! -f apps/web/out/web.config ]; then
            echo "::error::apps/web/out/web.config missing (should come from apps/web/public/)"
            exit 1
          fi
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload to Hostek over FTPS (lftp)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          REMOTE_DIR: ${{ vars.FTP_SERVER_DIR || './' }}
          # "strict" verifies the server cert. Hostek's cert is for *.hostek.se, so a
          # host like capitalpidesign.se fails; set repo variable FTP_SECURITY=loose
          # until a matching *.hostek.se hostname is used.
          FTP_SECURITY: ${{ vars.FTP_SECURITY || 'strict' }}
        run: |
          # Explicit FTPS, encrypted control + data. No --delete: never removes remote files.
          VERIFY=yes; [ "$FTP_SECURITY" = "loose" ] && VERIFY=no
          DRY=""; [ "$DRY_RUN" = "true" ] && DRY="--dry-run"
          # Credentials go through stdin (not argv) and are masked in logs by Actions.
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate $VERIFY
          set net:max-retries 3
          set net:timeout 30
          open -p $FTP_PORT -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          mirror -R --verbose --no-perms --parallel=2 $DRY apps/web/out/ $REMOTE_DIR
          bye
          EOF
      - name: Smoke check - site
        if: env.DRY_RUN != 'true'
        run: |
          sleep 5
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 https://pistora.se/ || true)
          echo "https://pistora.se/ -> HTTP $code"
          case "$code" in 2*|3*) ;; *) echo "::error::pistora.se returned HTTP $code"; exit 1 ;; esac
      - name: Smoke check - API (warning only)
        if: env.DRY_RUN != 'true'
        run: |
          # The API runs at home and is not deployed by this pipeline; it may be offline
          # (e.g. during the Raspberry Pi move), so this never fails the deploy.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 2 --retry-delay 5 https://api.pistora.se/health || true)
          echo "https://api.pistora.se/health -> HTTP $code"
          case "$code" in 2*) ;; *) echo "::warning::api.pistora.se/health returned HTTP $code (API offline or blocked?)" ;; esac
